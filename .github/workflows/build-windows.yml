name: Build And Release Windows Portable EXE

on:
  push:
    branches:
      - python
      - 'codex/v*'
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      DIST_ROOT: dist
      APP_FOLDER_PATTERN: '*V1_3_2'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build portable EXE
        shell: pwsh
        run: .\build_portable.ps1

      - name: Package build output
        id: package
        shell: pwsh
        run: |
          $appDir = Get-ChildItem -Path $env:DIST_ROOT -Directory -Filter $env:APP_FOLDER_PATTERN | Select-Object -First 1
          if ($null -eq $appDir) { throw "No portable app directory was produced under $env:DIST_ROOT." }
          $zipPath = Join-Path $env:RUNNER_TEMP ($appDir.Name + '-windows-portable.zip')
          Compress-Archive -Path $appDir.FullName -DestinationPath $zipPath -Force
          "app_dir=$($appDir.Name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "zip_path=$zipPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.app_dir }}-windows-portable
          path: ${{ steps.package.outputs.zip_path }}
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: 公文排版助手 ${{ github.ref_name }}
          files: ${{ steps.package.outputs.zip_path }}
          body_path: RELEASE_NOTES.md
