name: Build And Release Windows Portable EXE

on:
  push:
    branches:
      - python
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Build portable EXE
        shell: pwsh
        run: .\build_portable.ps1

      - name: Package build output
        id: package
        shell: pwsh
        run: |
          $appDir = Get-ChildItem -Path dist -Directory | Select-Object -First 1
          if ($null -eq $appDir) { throw 'dist ?????????????' }
          $zipPath = Join-Path $env:RUNNER_TEMP ($appDir.Name + '.zip')
          Compress-Archive -Path $appDir.FullName -DestinationPath $zipPath -Force
          "app_dir=$($appDir.Name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "zip_path=$zipPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.app_dir }}-windows-portable
          path: ${{ steps.package.outputs.zip_path }}
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.package.outputs.zip_path }}
          generate_release_notes: true
